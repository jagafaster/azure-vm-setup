<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Azure VM Builder Challenge</title>
<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(0,120,212,.5)}50%{box-shadow:0 0 0 8px rgba(0,120,212,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes confettiFall{0%{transform:translateY(-40px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes slideInR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

.fade-up{animation:fadeUp .35s ease both}
.pop-in{animation:popIn .4s ease both}
.shake{animation:shake .3s ease}
.blink{animation:blink 1s step-start infinite}

.comp-card{
  cursor:pointer;user-select:none;transition:all .18s;
  border:2px solid var(--border);border-radius:12px;
  background:var(--card);padding:9px 12px;
  display:flex;align-items:center;gap:10px;position:relative;
}
.comp-card:hover{transform:translateY(-1px);border-color:rgba(0,120,212,.55);}
.comp-card.selected{
  border-color:#0078d4!important;background:rgba(0,120,212,.1)!important;
  box-shadow:0 0 0 3px rgba(0,120,212,.22),0 0 16px rgba(0,120,212,.18);
  transform:translateY(-2px);
}
.comp-card.used{opacity:.28;pointer-events:none;cursor:not-allowed;}

.drop-slot{
  border:2px dashed rgba(0,120,212,.3);border-radius:10px;
  padding:8px 10px;min-height:54px;background:rgba(0,120,212,.03);
  transition:all .2s;cursor:pointer;
  display:flex;align-items:center;gap:8px;position:relative;
}
.drop-slot:hover{border-color:rgba(0,120,212,.6);background:rgba(0,120,212,.07);}
.drop-slot.slot-active{
  border-color:#0078d4!important;background:rgba(0,120,212,.12)!important;
  animation:pulseRing 1.3s ease infinite;
}
.drop-slot.slot-filled{border-style:solid;border-color:#0078d4;background:rgba(0,120,212,.06);}

.remove-x{
  position:absolute;top:-7px;right:-7px;width:20px;height:20px;
  border-radius:50%;background:#d83b01;color:#fff;
  font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;border:2px solid var(--card);line-height:1;
}

.star-lit{color:#fbbf24;font-size:.95rem;}
.star-dim{color:rgba(251,191,36,.18);font-size:.95rem;}

.pill{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 9px;border-radius:999px;font-size:.68rem;font-weight:600;
}
.cat-tab{
  cursor:pointer;padding:5px 10px;border-radius:8px;
  font-size:.72rem;font-weight:600;transition:all .15s;
  border:1.5px solid var(--border);white-space:nowrap;flex-shrink:0;
}
.cat-tab.active{background:#0078d4;color:#fff;border-color:#0078d4;}
.cat-tab:hover:not(.active){border-color:#0078d4;color:#0078d4;}

.panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
}
.p-head{
  padding:9px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.p-body{flex:1;overflow-y:auto;padding:10px;}

.sel-strip{
  background:rgba(0,120,212,.1);border:1.5px solid #0078d4;
  border-radius:10px;padding:7px 11px;margin:0 10px 8px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}

.az-hdr{background:linear-gradient(90deg,#003e92,#0078d4 60%,#1498dd);}

.confetti-p{
  position:fixed;border-radius:2px;pointer-events:none;z-index:9999;
  animation:confettiFall linear forwards;
}
.ach-pop{
  position:fixed;top:58px;right:14px;z-index:9999;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border:1.5px solid #fbbf24;border-radius:12px;
  padding:12px 16px;min-width:230px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  animation:slideInR .35s ease;
}

.vm-inp{
  background:var(--background);border:2px solid var(--border);
  border-radius:10px;padding:7px 12px;font-size:.83rem;
  color:var(--foreground);outline:none;transition:border-color .2s;width:100%;
}
.vm-inp:focus{border-color:#0078d4;}
.vm-inp::placeholder{color:var(--placeholder,#888);}

.meter{height:7px;border-radius:4px;background:rgba(0,0,0,.12);overflow:hidden;}
.mfill{height:100%;border-radius:4px;transition:width .55s ease;}

.terminal{
  font-family:'Courier New',monospace;font-size:.72rem;
  background:#0d1117;color:#58a6ff;border-radius:8px;
  padding:10px;height:155px;overflow-y:auto;border:1px solid #30363d;
}
.t-ok{color:#3fb950;} .t-warn{color:#d29922;}
.t-head{color:#f0f6ff;font-weight:700;} .t-dim{color:#8b949e;}

.exp-box{
  border-radius:9px;padding:9px 12px;margin-top:6px;border:1px solid;
  font-size:.72rem;line-height:1.58;
}
.exp-ok   {border-color:rgba(16,124,16,.4); background:rgba(16,124,16,.07);}
.exp-part {border-color:rgba(255,140,0,.4); background:rgba(255,140,0,.07);}
.exp-bad  {border-color:rgba(216,59,1,.4);  background:rgba(216,59,1,.07);}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:rgba(120,120,200,.3);border-radius:3px;}
body{background:var(--background);margin:0;padding:0;}
</style>
</head>
<body class="text-[var(--foreground)] antialiased">

<!-- HEADER -->
<div class="az-hdr text-white px-4 py-2 flex items-center gap-2 sticky top-0 z-50 shadow-lg" style="min-height:44px">
  <svg width="22" height="22" viewBox="0 0 96 96" fill="none"><path d="M54.9 6.7L27.5 51.5l27.4 7.8L96 89.3H58.9L32.1 45.2 6.7 89.3H0l38.6-66.4L54.9 6.7z" fill="white"/></svg>
  <span class="font-semibold text-sm hidden sm:block">Azure VM Builder Challenge</span>
  <div class="flex-1"></div>
  <div id="hXP"  class="pill" style="background:rgba(251,191,36,.2);color:#fbbf24;border:1px solid rgba(251,191,36,.3)">⚡ 0 XP</div>
  <div id="hLvl" class="pill ml-1" style="background:rgba(139,92,246,.2);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)">🏅 Lv 1</div>

<div id="root" style="height:calc(100vh - 44px);overflow:hidden;display:flex;flex-direction:column;"></div>

        [],0,{}),
      network: E('net_prem',

    },
  },
  {
    id:'hpc', emoji:'🔬', color:'#5c2d91',

const ACHIEVS = [
  {id:'first',   ico:'🚀',name:'First Deploy',    desc:'Deployed your first VM'},
  {id:'perfect', ico:'💎',name:'Perfect Round',   desc:'3 stars on all 7 slots'},

  {id:'xp200',   ico:'⚡',name:'XP Powerhouse',  desc:'Earned 200+ XP total'},
  {id:'xp500',   ico:'🔥',name:'XP Inferno',     desc:'Earned 500+ XP total'},
  {id:'noGPU',   ico:'💸',name:'Budget Master',  desc:'Chose No GPU correctly'},

/* ── STATE ──────────────────────────────────── */
const ST = {
  round:0, phase:'build',
  placed:{}, sel:null, vmName:'',
  scores:[], details:[],
  xp:0, level:1, ach: new Set(),
};
let activeTab = 'cpu';

/* ── UTILS ──────────────────────────────────── */
function getComp(id) {
  for (const arr of Object.values(COMPS))
    for (const c of arr) if (c.id === id) return c;
  return null;
}
function getCat(id) {
  for (const [k, arr] of Object.entries(COMPS))
    if (arr.find(c => c.id === id)) return k;
  return null;
}
function starsHTML(n, max) {
  max = max || 3;
  var h = '';
  for (var i = 0; i < max; i++)
    h += '<span class="' + (i < n ? 'star-lit' : 'star-dim') + '">★</span>';
  return h;
}
function hexRGB(h) {
  return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
}
function el(id) { return document.getElementById(id); }

function addXP(n) {
  ST.xp += n; refreshHdr();
  // float
  var f = document.createElement('div');
  f.textContent = '+' + n + ' XP';
  f.style.cssText = 'position:fixed;top:54px;right:80px;color:#fbbf24;font-weight:700;font-size:.9rem;pointer-events:none;z-index:9999;animation:fadeUp .85s ease forwards;';
  el('xpBox').appendChild(f);
  setTimeout(function(){f.remove();}, 900);
  if (ST.xp >= 200) unlockAch('xp200');
  if (ST.xp >= 500) unlockAch('xp500');
}

function refreshHdr() {
  var lvls = [0,80,200,400,800];
  var lv = 1;
  for (var i = 1; i < lvls.length; i++) if (ST.xp >= lvls[i]) lv = i+1;
  ST.level = lv;
  el('hXP').textContent  = '⚡ ' + ST.xp + ' XP';
  el('hLvl').textContent = '🏅 Lv ' + lv;
  el('hQ').textContent   = ST.phase === 'summary' ? 'Done!' : 'Q ' + (ST.round+1) + '/6';
}

function unlockAch(id) {
  if (ST.ach.has(id)) return;
  ST.ach.add(id);
  var a = ACHIEVS.find(function(x){return x.id===id;}); if (!a) return;
  var p = document.createElement('div');
  p.className = 'ach-pop';
  p.innerHTML = '<div style="display:flex;align-items:center;gap:12px">'
    + '<div style="font-size:2rem">' + a.ico + '</div>'
    + '<div>'
      + '<div style="color:#fbbf24;font-weight:700;font-size:.76rem">Achievement Unlocked!</div>'
      + '<div style="font-weight:700;font-size:.88rem">' + a.name + '</div>'
      + '<div style="color:var(--muted-foreground);font-size:.7rem">' + a.desc + '</div>'
    + '</div></div>';
  el('achBox').appendChild(p);
  setTimeout(function(){
    p.style.transition='all .4s ease';p.style.opacity='0';p.style.transform='translateX(60px)';
    setTimeout(function(){p.remove();},400);
  },3000);
}

function confetti() {
  var cols = ['#0078d4','#fbbf24','#3fb950','#ff8c00','#c678dd','#38bdf8'];
  for (var i = 0; i < 80; i++) {
    var p = document.createElement('div');
    p.className = 'confetti-p';
    p.style.cssText = 'left:'+Math.random()*100+'vw;background:'+cols[Math.floor(Math.random()*cols.length)]
      +';width:'+(5+Math.random()*8)+'px;height:'+(5+Math.random()*8)+'px'
      +';animation-duration:'+(1.4+Math.random()*2)+'s;animation-delay:'+(Math.random()*.5)+'s;';
    el('cfBox').appendChild(p);
    setTimeout(function(){p.remove();},4000);
  }
}

/* ── SCORING ─────────────────────────────────── */
function scoreSlot(sc, key, pid) {
  if (!pid) return {stars:0, cls:'bad', fb:'Nothing placed here'};
  var ideal = sc.ideal[key];
  if (pid === ideal.id) return {stars:3, cls:'ok', fb:'Perfect choice!'};
  if (ideal.partial.indexOf(pid) !== -1) {
    // Use per-item star override if available, else fall back to default ps
    var pStars = (ideal.partialPS && ideal.partialPS[pid] !== undefined) ? ideal.partialPS[pid] : ideal.ps;
    return {stars:pStars, cls:'part', fb:'Good but not optimal'};
  }
  return {stars:0, cls:'bad', fb:'Wrong component for this workload'};
}
function calcRound(sc) {
  var det = {}, total = 0;
  for (var i = 0; i < SLOTS.length; i++) {
    var sl = SLOTS[i];
    var r = scoreSlot(sc, sl.key, ST.placed[sl.key]);
    det[sl.key] = r; total += r.stars;
  }
  return {det:det, total:total, max:SLOTS.length*3};
}

/* ── SHELF ───────────────────────────────────── */
var CAT_LBL = {cpu:'⚙️ CPU', ram:'🧠 RAM', storage:'💽 Disk', gpu:'🎮 GPU', os:'💿 OS', sg:'🛡️ SG', network:'📡 Net'};

function shelfItemsHtml(cat) {
  var comps = COMPS[cat];
  var h = '';
  for (var i = 0; i < comps.length; i++) {
    var c = comps[i];
    var used = Object.values(ST.placed).indexOf(c.id) !== -1;
    var sel  = ST.sel === c.id;
    h += '<div id="ci_'+c.id+'" class="comp-card'+(used?' used':'')+(sel?' selected':'')+'" '
      + 'data-cid="'+c.id+'" onclick="selComp(\''+c.id+'\')" style="margin-bottom:6px">'
      + '<span style="font-size:1.3rem">'+c.ico+'</span>'
      + '<div style="flex:1;min-width:0">'
        + '<div style="font-weight:600;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c.name+'</div>'
        + '<div style="font-size:.68rem;color:var(--muted-foreground)">'+c.sub+'</div>'
      + '</div>'
      + '<div style="position:relative" title="'+c.tip+'">'
        + '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="color:var(--muted-foreground)">'
          + '<circle cx="12" cy="12" r="10"/><path d="M12 6v2M12 10v8" stroke="white" stroke-width="2.5"/>'
        + '</svg>'
      + '</div>'
    + '</div>';
  }
  return h;
}

function switchTab(cat) {
  activeTab = cat;
  var tabs = document.querySelectorAll('.cat-tab');
  for (var i = 0; i < tabs.length; i++)
    tabs[i].classList.toggle('active', tabs[i].dataset.cat === cat);
  el('shelfItems').innerHTML = shelfItemsHtml(cat);
}

/* ── SLOT HTML ───────────────────────────────── */
function slotHTML(sl) {
  var pid = ST.placed[sl.key];
  var comp = pid ? getComp(pid) : null;
  var filledCls = pid ? ' slot-filled' : '';
  var activeCls = (ST.sel && getCat(ST.sel) === sl.key && !pid) ? ' slot-active' : '';
  var inner = '';
  if (pid && comp) {
    inner = '<div class="remove-x" onclick="event.stopPropagation();removeSlot(\''+sl.key+'\')">✕</div>'
      + '<span style="font-size:1.25rem">'+comp.ico+'</span>'
      + '<div style="flex:1;min-width:0">'
        + '<div style="font-weight:600;font-size:.77rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+comp.name+'</div>'
        + '<div style="font-size:.63rem;color:var(--muted-foreground)">'+comp.sub+'</div>'
      + '</div>'
      + '<span class="pill pop-in" style="background:rgba(0,120,212,.15);color:#0078d4;font-size:.6rem">✓ Set</span>';
  } else {
    inner = '<span style="color:var(--muted-foreground);font-size:.7rem;font-style:italic">② Click here to place</span>';
  }
  return '<div>'
    + '<div style="font-size:.65rem;font-weight:600;color:var(--muted-foreground);margin-bottom:2px">'+sl.ico+' '+sl.label+'</div>'
    + '<div id="slot_'+sl.key+'" class="drop-slot'+filledCls+activeCls+'" onclick="clickSlot(\''+sl.key+'\')">'
      + inner
    + '</div>'
  + '</div>';
}

/* ── CLICK-TO-SELECT / CLICK-TO-PLACE ───────── */
function selComp(id) {
  if (ST.sel === id) { ST.sel = null; } else { ST.sel = id; }
  refreshShelf();
  refreshSlotHighlights();
  refreshSelStrip();
}

function clickSlot(key) {
  if (!ST.sel) { if (ST.placed[key]) removeSlot(key); return; }
  var cat = getCat(ST.sel);
  if (cat !== key) {
    var slEl = el('slot_'+key);
    if (slEl) { slEl.classList.add('shake'); setTimeout(function(){slEl.classList.remove('shake');},330); }
    showWarnMsg(key, cat);
    return;
  }
  if (ST.placed[key]) freeComp(ST.placed[key]);
  ST.placed[key] = ST.sel;
  ST.sel = null;
  refreshShelf();
  refreshSlotHighlights();
  refreshSelStrip();
  var slEl = el('slot_'+key);
  if (slEl) slEl.outerHTML = slotHTML(SLOTS.find(function(s){return s.key===key;}));
  updateProgress();
  updateDeployBtn();
}

function removeSlot(key) {
  if (!ST.placed[key]) return;
  freeComp(ST.placed[key]);
  delete ST.placed[key];
  var slEl = el('slot_'+key);
  if (slEl) slEl.outerHTML = slotHTML(SLOTS.find(function(s){return s.key===key;}));
  updateProgress();
  updateDeployBtn();
}

function freeComp(id) {
  for (var k in ST.placed) if (ST.placed[k]===id) delete ST.placed[k];
  var card = el('ci_'+id);
  if (card) card.classList.remove('used');
}

function refreshShelf() {
  var cards = document.querySelectorAll('.comp-card');
  for (var i = 0; i < cards.length; i++) {
    var cid = cards[i].dataset.cid;
    cards[i].classList.toggle('selected', cid === ST.sel);
  }
}

function refreshSlotHighlights() {
  var cat = ST.sel ? getCat(ST.sel) : null;
  for (var i = 0; i < SLOTS.length; i++) {
    var sEl = el('slot_'+SLOTS[i].key);
    if (!sEl) continue;
    var isTarget = cat && SLOTS[i].key === cat && !ST.placed[SLOTS[i].key];
    sEl.classList.toggle('slot-active', !!isTarget);
  }
}

function refreshSelStrip() {
  var strip = el('selStrip');
  if (!strip) return;
  if (!ST.sel) { strip.style.display = 'none'; return; }
  var comp = getComp(ST.sel);
  var cat  = getCat(ST.sel);
  var slbl = (SLOTS.find(function(s){return s.key===cat;})||{label:cat}).label;
  strip.style.display = 'flex';
  strip.innerHTML = '<span style="font-size:1.4rem">'+comp.ico+'</span>'
    + '<div style="flex:1;min-width:0">'
      + '<div style="font-weight:700;font-size:.79rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+comp.name+'</div>'
      + '<div style="font-size:.65rem;color:var(--muted-foreground)">Now click the <strong>'+slbl+'</strong> slot</div>'
    + '</div>'
    + '<button onclick="ST.sel=null;refreshShelf();refreshSlotHighlights();refreshSelStrip()" '
      + 'style="font-size:.73rem;color:#d83b01;font-weight:700;background:none;border:none;cursor:pointer">Cancel</button>';
}

function showWarnMsg(slotKey, compCat) {
  var wEl = el('warnMsg');
  var slbl = (SLOTS.find(function(s){return s.key===slotKey;})||{label:slotKey}).label.replace(/\(.*\)/,'').trim();
  var clbl = {cpu:'CPU',ram:'RAM',storage:'Storage',gpu:'GPU',os:'OS',sg:'Security Group',network:'Network'}[compCat]||compCat;
  if (wEl) {
    wEl.textContent = '⚠ That\'s a '+clbl+' component — place it in the '+slbl+' slot!';
    wEl.style.opacity = '1';
    clearTimeout(wEl._t);
    wEl._t = setTimeout(function(){wEl.style.opacity='0';},2300);
  }

function startDeploy() {
  if (Object.keys(ST.placed).length < SLOTS.length || !ST.vmName.trim()) return;
  var sc = SCENARIOS[ST.round];
  var modal = document.createElement('div');
  modal.id = 'depModal';

  var icons = ['🔌','🌐','🔒','💿','🖥️','📊','🎉'];
  var iIdx = 0;
  var total = DEPLOY_LOG.length;

  DEPLOY_LOG.forEach(function(entry, i) {
    setTimeout(function() {
      var d = document.createElement('div');
      d.className = entry[1]; d.textContent = entry[2];
      term.appendChild(d); term.scrollTop = 9999;
      var pct = Math.round(((i+1)/total)*100);

      var dp = el('depPct'); if (dp) dp.textContent = pct+'%';

        sp.className = 'pop-in'; sp.textContent = icons[iIdx++];
        var di = el('depIcons'); if (di) di.appendChild(sp);
      }
      if (i === total-1) setTimeout(function(){modal.remove(); doReview();},700);
    }, entry[0]);
  });
}

/* ── REVIEW ──────────────────────────────────── */
function doReview() {
  ST.phase = 'review';
  var sc = SCENARIOS[ST.round];
  var res = calcRound(sc);
  ST.details.push(res.det);
  ST.scores.push(res.total);
  addXP(res.total * 3);
  if (ST.round === 0) unlockAch('first');
  if (Object.values(res.det).every(function(d){return d.stars===3;})) unlockAch('perfect');
  if (Object.values(res.det).filter(function(d){return d.stars===3;}).length===7) unlockAch('all7ok');
  var sc2 = sc; // for closure
  if ((sc2.id==='hpc'||sc2.id==='website'||sc2.id==='ecommerce'||sc2.id==='mobileapi') && ST.placed['gpu']==='gpu_none') unlockAch('noGPU');
  if (ST.round === 2) unlockAch('half');
  if (ST.round === SCENARIOS.length-1) unlockAch('ace');
  renderReview();
}

function expHTML(sc, sl, d) {
  var pid = ST.placed[sl.key];
  var ideal = sc.ideal[sl.key];
  var pc = pid ? getComp(pid) : null;
  var ic = getComp(ideal.id);

  if (d.cls === 'ok') {
    return '<div class="exp-box exp-ok">'
      +'<div style="font-weight:700;color:#3fb950;font-size:.67rem;margin-bottom:3px">✅ Why this is perfect</div>'
      +ideal.why
    +'</div>';
  }
  if (d.cls === 'part') {
    var pNote = (ideal.partialWhy && pid && ideal.partialWhy[pid]) ? ideal.partialWhy[pid] : 'This choice works but is not fully optimal for this specific workload.';
    return '<div class="exp-box exp-part">'
      +'<div style="font-weight:700;color:#fb923c;font-size:.67rem;margin-bottom:3px">⚡ Why it\'s not fully optimal</div>'
      +pNote
      +'<div style="margin-top:7px;font-weight:700;color:#3fb950;font-size:.67rem;margin-bottom:3px">✅ What '+ic.name+' would do instead</div>'
      +ideal.why
    +'</div>';
  }
  // bad / nothing
  var wNote = pc ? ideal.wrongWhy : 'No component was placed in this slot — it is required for VM functionality.';
  var pcName = pc ? pc.name : 'nothing';
  return '<div class="exp-box exp-bad">'
    +'<div style="font-weight:700;color:#f87171;font-size:.67rem;margin-bottom:3px">❌ Why '+pcName+' is wrong here</div>'
    +wNote
    +'<div style="margin-top:7px;font-weight:700;color:#3fb950;font-size:.67rem;margin-bottom:3px">✅ Correct choice: '+ic.ico+' '+ic.name+'</div>'
    +ideal.why
  +'</div>';
}

function resetAll() {
  ST.round=0; ST.phase='build'; ST.placed={}; ST.sel=null; ST.vmName='';
  ST.scores=[]; ST.details=[]; ST.xp=0; ST.level=1; ST.ach=new Set();
  activeTab='cpu'; refreshHdr(); renderBuild(); updateDeployBtn();
}

/* ── BOOT ────────────────────────────────────── */
try {
  renderBuild();
} catch(e) {
  el('root').innerHTML = '<div style="padding:30px;text-align:center;color:red">'
    + '<div style="font-size:2rem">⚠️</div>'
    + '<div style="font-weight:700;margin-top:8px">Startup error: '+e.message+'</div>'
    + '<pre style="text-align:left;margin-top:10px;font-size:.7rem">'+e.stack+'</pre>'
    + '</div>';
}
</script>
